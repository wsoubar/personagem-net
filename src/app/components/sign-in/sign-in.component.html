<section class="auth-block">
  <h1>Entrar</h1>
  <form (ngSubmit)="authService.SignIn(email.value, password.value)">
    <div class="mb-3"><label for="email">E-mail</label><input id="email" type="email" class="form-control" autocomplete="email" #email required></div>
    <div class="mb-3"><label for="password">Senha</label><input id="password" type="password" class="form-control" autocomplete="current-password" minlength="6" #password required></div>
    <button type="submit" class="btn btn-primary" [disabled]="authService.busy()">Entrar</button>
  </form>
  <div class="mt-3">
    <button type="button" class="btn btn-outline-primary me-2" [disabled]="authService.busy()" (click)="authService.GoogleAuth()">Entrar com Google</button>
    <button type="button" class="btn btn-outline-primary" [disabled]="authService.busy()" (click)="authService.FacebookAuth()">Entrar com Facebook</button>
  </div>
  <p class="mt-3"><a routerLink="/forgot-password">Esqueci minha senha</a></p>
  <p><a routerLink="/register-user">Criar uma conta</a></p>
  <div *ngIf="authService.demoEnabled" class="mt-4 border-top pt-3">
    <button type="button" class="btn btn-link p-0" [disabled]="authService.busy()" (click)="authService.SignInDemo()">Entrar sem cadastro (demonstração)</button>
    <p class="small text-muted mt-2">Conheça as páginas com personagens de exemplo. Requer os emuladores locais em execução.</p>
  </div>
</section>
