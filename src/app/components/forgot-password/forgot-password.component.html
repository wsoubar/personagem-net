<h1>Recuperar senha</h1>
<p>Informe seu e-mail para solicitar a redefinição da senha.</p>
<form (ngSubmit)="authService.ForgotPassword(email.value)">
  <label for="email">E-mail</label><input id="email" type="email" class="form-control mb-3" autocomplete="email" #email required>
  <button type="submit" class="btn btn-primary" [disabled]="authService.busy()">Enviar recuperação</button>
</form>
<p class="mt-3"><a routerLink="/sign-in">Voltar à entrada</a></p>
