<h1>Verificar e-mail</h1>
<p *ngIf="authService.userData as user">Confira a caixa de entrada de <strong>{{ user.email }}</strong> e abra o link de verificação.</p>
<button type="button" class="btn btn-primary" [disabled]="authService.busy()" (click)="authService.SendVerificationMail()">Reenviar verificação</button>
<p class="mt-3"><a routerLink="/dashboard">Continuar para minha conta</a></p>
