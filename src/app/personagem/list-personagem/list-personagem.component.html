<h2>Personagens</h2>
<p *ngIf="loading()" role="status">Carregando personagens…</p>
<p *ngIf="error()" role="alert">{{ error() }}</p>
<p *ngIf="!loading() && !error() && personagens().length === 0">Você ainda não tem personagens.</p>
<div class="table-responsive" *ngIf="personagens().length">
  <table class="table table-striped">
    <thead><tr><th scope="col">#</th><th scope="col">Nome</th><th scope="col">Data de criação</th><th scope="col">Ações</th></tr></thead>
    <tbody>
      <tr *ngFor="let p of personagens(); let i = index">
        <th scope="row">{{ i + 1 }}</th><td>{{ p.nome }}</td>
        <td>{{ (creationDate(p.dataCriacao) | date:'dd/MM/yyyy HH:mm') || 'Não informada' }}</td>
        <td>
          <button type="button" class="btn btn-danger me-2" disabled aria-label="Exclusão ainda não implementada" title="Exclusão ainda não implementada"><i class="fa fa-trash" aria-hidden="true"></i></button>
          <a class="btn btn-primary" [routerLink]="['/edit-personagem', p.id]" [attr.aria-label]="'Ver personagem ' + p.nome"><i class="fa fa-edit" aria-hidden="true"></i></a>
        </td>
      </tr>
    </tbody>
  </table>
</div>
<a class="btn btn-primary" routerLink="/add-personagem">Novo personagem</a>
