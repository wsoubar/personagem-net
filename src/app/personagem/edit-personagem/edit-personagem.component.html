<h1>Personagem</h1>
<p *ngIf="loading()" role="status">Carregando personagem…</p>
<p *ngIf="error()" role="alert">{{ error() }}</p>
<p *ngIf="!loading() && !error() && !personagem()">Personagem não encontrado.</p>
<dl *ngIf="personagem() as p"><dt>Nome</dt><dd>{{ p.nome }}</dd><dt>Resumo</dt><dd>{{ p.resumo || 'Não informado' }}</dd></dl>
<p>A edição ainda não foi implementada neste protótipo.</p>
<a routerLink="/dashboard">Voltar aos personagens</a>
