<nav *ngIf="authService.userData" class="navbar sticky-top navbar-dark navbar-expand-lg bg-danger" aria-label="Navegação principal">
  <div class="container">
    <a class="navbar-brand" routerLink="/dashboard">Personagens</a>
    <button class="navbar-toggler" type="button" (click)="menuOpen.set(!menuOpen())" aria-controls="main-menu" [attr.aria-expanded]="menuOpen()" aria-label="Alternar navegação"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" [class.show]="menuOpen()" id="main-menu">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" routerLink="/dashboard">Início</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/feed">Feed</a></li>
        <li class="nav-item"><button class="btn nav-link" type="button" [disabled]="authService.busy()" (click)="authService.SignOut()">Sair</button></li>
      </ul>
    </div>
  </div>
</nav>
<div *ngIf="notice.message()" class="alert alert-info" role="status">{{ notice.message() }}</div>
<router-outlet></router-outlet>
